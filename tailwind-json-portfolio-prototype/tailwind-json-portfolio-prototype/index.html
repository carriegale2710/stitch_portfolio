<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tailwind + JSON Portfolio Prototype</title>
    <script>
      // Optional: customize Tailwind config
      tailwind = window.tailwind || {};
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                50: '#f0f9ff',
                100: '#e0f2fe',
                500: '#0ea5e9',
                600: '#0284c7',
              },
            },
          },
        },
      };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-50 text-gray-900">
    <!-- Header -->
    <header class="mx-auto max-w-5xl px-4 py-10">
      <h1 class="text-3xl font-bold tracking-tight text-gray-900">
        Your Name
      </h1>
      <p class="mt-1 text-sm text-gray-600">
        Solo builder · Micro‑SaaS · AI agents
      </p>
    </header>

    <!-- Projects -->
    <main class="mx-auto max-w-5xl px-4 pb-16">
      <section id="projects-section">
        <h2 class="text-xl font-semibold text-gray-900">Projects</h2>

        <div
          id="projects-grid"
          class="mt-6 grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3"
        ></div>
      </section>
    </main>

    <script type="module" src="scripts/render-projects.js"></script>
  </body>
</html>
